name: OptionKiller
options:
  bundleIdPrefix: com.optionkiller
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
targets:
  OptionKiller:
    type: application
    platform: iOS
    sources:
      - path: OptionKiller
        excludes:
          - "www"
          - "Info.plist"
      - path: OptionKiller/www
        type: folder
        buildPhase: resources
    info:
      path: OptionKiller/Info.plist
      properties:
        CFBundleDisplayName: OptionKiller
        CFBundleName: OptionKiller
        CFBundleShortVersionString: "1.1.0"
        CFBundleVersion: "2"
        CFBundleDevelopmentRegion: zh_CN
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
        ITSAppUsesNonExemptEncryption: false
        UIStatusBarStyle: UIStatusBarStyleDarkContent
        UIViewControllerBasedStatusBarAppearance: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.optionkiller.app
        PRODUCT_NAME: OptionKiller
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_KEY_CFBundleDisplayName: OptionKiller
schemes:
  OptionKiller:
    build:
      targets:
        OptionKiller: all
    run:
      config: Debug
    archive:
      config: Release
